<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOVIE PROMO.id - Jasa Titip Tiket Bioskop</title>
    <style>
        /* CSS Reset & Tampilan Clean */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: #f4f6f9;
            min-height: 100vh;
            padding: 20px;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container Utama (Card UI HP) */
        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
            position: relative;
        }

        /* Header Mockup */
        .header-mockup {
            background: #fff;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            font-size: 14px;
            font-weight: bold;
        }

        /* Banner Promo */
        .promo-banner {
            width: 100%;
            height: 170px;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
            color: white;
        }
        .promo-banner h2 { font-size: 22px; margin-bottom: 5px; }
        .promo-banner p { font-size: 12px; opacity: 0.9; }

        /* VIP Card & Sedang Tayang */
        .info-section { padding: 15px; }
        .vip-card {
            background: linear-gradient(135deg, #f2994a, #f2c94c);
            color: white;
            padding: 12px 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .section-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;}
        .section-title button { background: none; border: none; color: #007bff; font-size: 13px; cursor: pointer; font-weight: 600; }

        /* Filter Kategori */
        .filter-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; margin-bottom: 15px; }
        .filter-btn { padding: 6px 14px; border: 1px solid #e0e0e0; border-radius: 20px; font-size: 12px; background: #fff; cursor: pointer; white-space: nowrap; color: #555; }
        .filter-btn.active { background: #007bff; color: white; border-color: #007bff; }

        /* Form Pemesanan */
        .form-section { padding: 0 15px 20px 15px; }
        .form-group { margin-bottom: 15px; }
        .form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #444; }
        .form-control { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; background: #fafafa; }
        .form-control:focus { outline: none; border-color: #007bff; background: #fff; }
        .note { font-size: 11px; color: #666; margin-top: 5px; font-style: italic; }

        /* Tombol Submit */
        .submit-btn {
            width: 100%;
            background-color: #25d366;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 5px;
        }
        .submit-btn:hover { background-color: #128c7e; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Mockup Header Smartphone -->
        <div class="header-mockup">
            <span>MOVIE PROMO.id</span>
            <div style="display: flex; gap: 12px; color: #555;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            </div>
        </div>

        <!-- Banner Promo -->
        <div class="promo-banner">
            <h2>BUY 1 GET 1 FREE</h2>
            <p>Spesial MOVIE PROMO.id | Promo Tiket Bioskop Terbatas 🔥</p>
        </div>

        <div class="info-section">
            <!-- VIP Card Mockup -->
            <div class="vip-card">
                <span>VIP MEMBER MOVIE PROMO</span>
                <span>0 Coins</span>
            </div>

            <!-- Sedang Tayang Title -->
            <div class="section-title">
                <span>Sedang Tayang</span>
                <button>Semua ></button>
            </div>

            <!-- Filter Bar -->
            <div class="filter-bar">
                <button class="filter-btn active">Semua Film</button>
                <button class="filter-btn">XXI</button>
                <button class="filter-btn">CGV</button>
                <button class="filter-btn">Cinépolis</button>
            </div>
        </div>

        <!-- Form Pemesanan -->
        <form class="form-section" id="formJastip">
            <div class="form-group">
                <label class="form-label">Pilih Film:</label>
                <select class="form-control" id="pilihFilm" required>
                    <option value="">-- Pilih Film yang Ingin Ditonton --</option>
                    <option value="Kado untuk Ibu" data-harga="40000">Kado untuk Ibu (B1G1 - Rp 40.000)</option>
                    <option value="Ketok Mejik" data-harga="35000">Ketok Mejik (B1G1 - Rp 35.000)</option>
                    <option value="Dan Bandung" data-harga="45000">Dan Bandung (B1G1 - Rp 45.000)</option>
                    <option value="Perumahan Laddaland" data-harga="40000">Perumahan Laddaland (B1G1 - Rp 40.000)</option>
                    <option value="Paket Santet" data-harga="40000">Paket Santet (B1G1 - Rp 40.000)</option>
                    <option value="Harusnya Horror" data-harga="45000">Harusnya Horror (B1G1 - Rp 45.000)</option>
                    <option value="Baby Udon" data-harga="45000">Baby Udon (B1G1 - Rp 45.000)</option>
                    <option value="The End of Oak Street" data-harga="50000">The End of Oak Street (Beli Satuan - Rp 50.000)</option>
                </select>
                <div class="note">*Harga di atas sudah termasuk paket promo (jika ada).</div>
            </div>
            
            <div class="form-group">
                <label class="form-label">Nama Lengkap (Sesuai KTP):</label>
                <input type="text" class="form-control" id="namaLengkap" placeholder="Contoh: Budi Santoso" required>
            </div>

            <div class="form-group">
                <label class="form-label">Email Resmi (Gmail):</label>
                <input type="email" class="form-control" id="emailGmail" placeholder="Contoh: budis@gmail.com" required>
            </div>

            <div class="form-group">
                <label class="form-label">Nomor WA Resmi (Aktif):</label>
                <input type="tel" class="form-control" id="noWA" placeholder="Contoh: 081234567890" required>
            </div>

            <!-- Tombol Kirim WA -->
            <button type="submit" class="submit-btn">
                Kirim Pesanan ke WhatsApp Admin
            </button>
        </form>
    </div>

    <!-- JavaScript Logika Kirim WhatsApp -->
    <script>
        const nomorAdmin = "6281234567890"; // Ganti dengan nomor WA lu (format 62...)

        document.getElementById('formJastip').addEventListener('submit', function(event) {
            event.preventDefault();

            const filmDipilih = document.getElementById("pilihFilm").value;
            const namaLengkap = document.getElementById("namaLengkap").value;
            const emailGmail = document.getElementById("emailGmail").value;
            const noWA = document.getElementById("noWA").value;

            const selectElement = document.getElementById("pilihFilm");
            const selectedOption = selectElement.options[selectElement.selectedIndex];
            const hargaTiket = selectedOption.getAttribute("data-harga");

            const pesanWA = `*PESANAN TIKET MOVIE PROMO.id*\n\n` +
                          `*Film:*\n${filmDipilih}\n\n` +
                          `*Data Pemesan:*\n` +
                          `- Nama: ${namaLengkap}\n` +
                          `- Email: ${emailGmail}\n` +
                          `- No WA: ${noWA}\n\n` +
                          `*Total Harga:*\nRp ${new Intl.NumberFormat('id-ID').format(hargaTiket)}\n` +
                          `_Mohon segera diproses ya min, terima kasih!_`;

            const encodedPesan = encodeURIComponent(pesanWA);
            const urlWhatsApp = `https://api.whatsapp.com/send?phone=${nomorAdmin}&text=${encodedPesan}`;

            window.open(urlWhatsApp, '_blank');
        });
    </script>
</body>
</html>
